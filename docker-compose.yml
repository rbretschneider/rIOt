services:
  riot-server:
    build:
      context: .
      args:
        VERSION: "1.0.0"
    container_name: riot-server
    ports:
      - "7331:7331"
    environment:
      - RIOT_DB_URL=postgres://riot:riot@riot-db:5432/riot?sslmode=disable
      - RIOT_PORT=7331
      - RIOT_API_KEY=changeme
      - RIOT_RETENTION_DAYS=30
      - RIOT_ADMIN_PASSWORD=changeme
      - RIOT_JWT_SECRET=
      # - RIOT_ALLOWED_ORIGINS=https://my-riot.example.com
      # - GOMEMLIMIT=2GiB              # Go runtime memory limit (default: 2 GiB)
      # Optional "Sign in with SSO" (OIDC-001) — dormant unless all three are
      # set. Bind the rIOt application to a group in your IdP FIRST.
      # - RIOT_OIDC_ISSUER_URL=https://auth.example.com/application/o/riot/
      # - RIOT_OIDC_CLIENT_ID=changeme
      # - RIOT_OIDC_CLIENT_SECRET=changeme
      # - RIOT_OIDC_BUTTON_LABEL=Sign in with authentik
      # Optional trusted reverse-proxy CIDRs — set only if rIOt sits behind
      # a reverse proxy (default empty trusts nobody, see .env.example).
      # - RIOT_TRUSTED_PROXIES=10.0.0.5/32
    depends_on:
      riot-db:
        condition: service_healthy
    restart: unless-stopped

  riot-db:
    image: postgres:16-alpine
    container_name: riot-db
    environment:
      - POSTGRES_USER=riot
      - POSTGRES_PASSWORD=riot
      - POSTGRES_DB=riot
    volumes:
      - riot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  riot-data:
