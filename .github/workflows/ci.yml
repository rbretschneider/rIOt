name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL for the PG-gated repository and migration tests
    # (CMD-LIFECYCLE-001). The credentials are literal test values, not secrets;
    # the tests refuse to run unless the database name contains "test".
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: riot_test
          POSTGRES_PASSWORD: riot_test
          POSTGRES_DB: riot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riot_test -d riot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIOT_TEST_PG_URL: postgres://riot_test:riot_test@localhost:5432/riot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run Go tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  test-go-integration:
    # PART-001 residual R1: the AC-019 relfilenode/no-rewrite gate and the
    # other PG-dependent PART-001 ACs (AC-001..009, AC-016, AC-018, AC-022)
    # are build-tag gated (`integration`) and skip cleanly with no DB
    # configured — this job is what actually runs them against a live
    # PostgreSQL 16 so the gate is enforced, not just written.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riot
          POSTGRES_PASSWORD: riot
          POSTGRES_DB: riot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run Docker storage and partition integration tests
        env:
          RIOT_TEST_DB_URL: postgres://riot:riot@localhost:5432/riot?sslmode=disable
          RIOT_TEST_PG_URL: postgres://riot:riot@localhost:5432/riot?sslmode=disable
        run: go test -p 1 -tags=integration -count=1 -v ./internal/server/db ./internal/server/partition ./internal/server/storage

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm run test:run

  test-maintenance-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Download existing Go dependencies
        run: go mod download
      - name: Root filesystem, process and shared-lock fixtures
        # Root is confined to an unprivileged disposable container. Repository
        # and dependency mounts are read-only; no Docker socket/cgroup mounts.
        run: |
          docker run --rm --network none \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/src,readonly \
            --mount type=bind,src="$(go env GOMODCACHE)",dst=/go/pkg/mod,readonly \
            -w /src -e GOPROXY=off -e GOSUMDB=off golang:1.24 \
            go test -race -count=1 ./internal/maintenance ./cmd/riot-agent-apply ./cmd/riot-maintenance
      - name: Signed installer and legacy migration fixtures
        # bookworm is Debian 12; trixie is Debian 13, which hawaii runs, so the
        # bare `systemctl` the agent sudoes resolves to the granted path on both.
        run: |
          for image in debian:bookworm-slim debian:trixie-slim; do
            docker run --rm \
              --mount type=bind,src="$GITHUB_WORKSPACE",dst=/src,readonly \
              -e DEBIAN_FRONTEND=noninteractive "$image" bash -ec '
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends python3 openssl sudo systemd ca-certificates curl gawk
                # Debian slim ships mawk; gawk is installed only for the awk agreement test (EXPECT-008 AC-007).
                update-alternatives --set awk /usr/bin/mawk
                RIOT_INSTALLER_FIXTURE=1 python3 /src/scripts/test_install_maintenance.py -v
              '
          done
      - name: Real apt recovery and no-removal fixtures
        run: |
          docker run --rm --network none \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/src,readonly \
            debian:bookworm-slim \
            bash /src/scripts/tests/maintenance-apt-fixture.sh --disposable-container

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
