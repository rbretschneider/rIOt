name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run Go tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  test-go-integration:
    # PART-001 residual R1: the AC-019 relfilenode/no-rewrite gate and the
    # other PG-dependent PART-001 ACs (AC-001..009, AC-016, AC-018, AC-022)
    # are build-tag gated (`integration`) and skip cleanly with no DB
    # configured — this job is what actually runs them against a live
    # PostgreSQL 16 so the gate is enforced, not just written.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riot
          POSTGRES_PASSWORD: riot
          POSTGRES_DB: riot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run PART-001 integration tests
        env:
          RIOT_TEST_DB_URL: postgres://riot:riot@localhost:5432/riot?sslmode=disable
        run: go test -tags=integration -count=1 -v ./internal/server/partition/...

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm run test:run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
