name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL for the PG-gated repository and migration tests
    # (CMD-LIFECYCLE-001). The credentials are literal test values, not secrets;
    # the tests refuse to run unless the database name contains "test".
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: riot_test
          POSTGRES_PASSWORD: riot_test
          POSTGRES_DB: riot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riot_test -d riot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIOT_TEST_PG_URL: postgres://riot_test:riot_test@localhost:5432/riot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run Go tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm run test:run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
